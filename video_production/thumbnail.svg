<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4F6F2"/>
      <stop offset="50%" stop-color="#EAEFE7"/>
      <stop offset="100%" stop-color="#DCE7D8"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2F6B50"/>
      <stop offset="100%" stop-color="#1D4A36"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7FD38C"/>
      <stop offset="100%" stop-color="#43B574"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FBFDFB"/>
    </linearGradient>
    <!-- Card Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#122B1E" flood-opacity="0.12"/>
    </filter>
    <filter id="heroShadow" x="-15%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="0" dy="26" stdDeviation="34" flood-color="#0E2318" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>

  <!-- Subtle Ambient Glow Rings -->
  <circle cx="200" cy="150" r="380" fill="#7FD38C" opacity="0.08" filter="blur(60px)"/>
  <circle cx="1700" cy="900" r="450" fill="#2F6B50" opacity="0.06" filter="blur(70px)"/>

  <!-- Left Column: Branding, Typography & Key Value Prop -->
  <g transform="translate(100, 140)">
    <!-- Brand Badge -->
    <rect width="210" height="44" rx="22" fill="#E2EBE0" stroke="#C8D9C5" stroke-width="1.5"/>
    <circle cx="26" cy="22" r="7" fill="#2F6B50"/>
    <text x="44" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#2F6B50" letter-spacing="1">PRODUCT WALKTHROUGH</text>

    <!-- Main Title -->
    <text x="0" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="82" font-weight="800" fill="#13241B" letter-spacing="-2">Appointment</text>
    <text x="0" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="82" font-weight="800" fill="#2F6B50" letter-spacing="-2">Prep</text>

    <!-- Subtitle / Mission -->
    <text x="0" y="285" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="28" font-weight="500" fill="#4B6355" letter-spacing="-0.5">
      The private healthcare visit preparation workspace.
    </text>
    <text x="0" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="22" font-weight="400" fill="#6A8274">
      Organize questions • Log medications • One-click clinical checklist
    </text>

    <!-- Core Value Pillars (Pill Badges) -->
    <g transform="translate(0, 390)">
      <!-- Pill 1: React 18 -->
      <rect x="0" y="0" width="130" height="42" rx="12" fill="#FFFFFF" stroke="#D7E2D5" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="65" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="15" font-weight="700" fill="#1D4A36" text-anchor="middle">React 18</text>

      <!-- Pill 2: Express REST API -->
      <rect x="145" y="0" width="170" height="42" rx="12" fill="#FFFFFF" stroke="#D7E2D5" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="230" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="15" font-weight="700" fill="#1D4A36" text-anchor="middle">Express REST API</text>

      <!-- Pill 3: MongoDB -->
      <rect x="330" y="0" width="135" height="42" rx="12" fill="#FFFFFF" stroke="#D7E2D5" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="397" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="15" font-weight="700" fill="#1D4A36" text-anchor="middle">MongoDB</text>
    </g>

    <!-- Callout Box: Medical Disclaimer / Boundary -->
    <g transform="translate(0, 480)">
      <rect width="620" height="150" rx="20" fill="#FFFFFF" stroke="#D4DFD2" stroke-width="1.5" filter="url(#shadow)"/>
      <path d="M 24 24 L 24 126" stroke="#2F6B50" stroke-width="5" stroke-linecap="round"/>
      <text x="44" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="18" font-weight="800" fill="#13241B" letter-spacing="0.5">PATIENT INFORMATION ORGANISER</text>
      <text x="44" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="15" font-weight="500" fill="#4B6355">
        Strict Non-Clinical Boundary: Zero medical diagnoses or dosage alterations.
      </text>
      <text x="44" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="15" font-weight="500" fill="#4B6355">
        Designed exclusively for patient-physician consultation readiness.
      </text>
    </g>

    <!-- Bottom URL Tag -->
    <text x="0" y="700" font-family="-apple-system, BlinkMacSystemFont, 'Inter', monospace" font-size="20" font-weight="700" fill="#2F6B50">
      ⚡ Live Production: backendcia2.vercel.app
    </text>
  </g>

  <!-- Right Visual Area: Layered Floating UI Cards (Real Application Mockup) -->
  <g transform="translate(860, 100)">
    <!-- Base Layer Card 1: Dashboard Main Window -->
    <g transform="translate(40, 20) rotate(-1.5)" filter="url(#heroShadow)">
      <rect width="900" height="580" rx="28" fill="#FFFFFF" stroke="#D2DED0" stroke-width="2"/>
      
      <!-- Top Window Bar -->
      <rect width="900" height="60" rx="28" fill="#F8FAF7" stroke="#E2EBE0" stroke-width="1"/>
      <circle cx="36" cy="30" r="7" fill="#F06A6A"/>
      <circle cx="58" cy="30" r="7" fill="#E8B949"/>
      <circle cx="80" cy="30" r="7" fill="#6BC27A"/>
      <text x="450" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="14" font-weight="600" fill="#6A8274" text-anchor="middle">Appointment Prep — Dashboard</text>

      <!-- Dashboard Header -->
      <text x="50" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="30" font-weight="800" fill="#13241B">Dashboard</text>
      <text x="50" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="14" font-weight="500" fill="#7A9385">Organize questions, self-reported medications, and clinical checklists</text>

      <!-- Stat Mini Card 1: Readiness Progress Ring -->
      <g transform="translate(50, 180)">
        <rect width="250" height="150" rx="20" fill="#F7F9F6" stroke="#E2EBE0" stroke-width="1.5"/>
        <!-- SVG Progress Ring -->
        <circle cx="75" cy="75" r="42" stroke="#E2ECE0" stroke-width="9" fill="none"/>
        <circle cx="75" cy="75" r="42" stroke="#2F6B50" stroke-width="9" stroke-linecap="round" stroke-dasharray="264" stroke-dashoffset="36" fill="none"/>
        <text x="75" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="20" font-weight="800" fill="#13241B" text-anchor="middle">86%</text>
        <text x="135" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="600" fill="#6A8274">VISIT READINESS</text>
        <text x="135" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="22" font-weight="800" fill="#2F6B50">Prepared</text>
      </g>

      <!-- Stat Mini Card 2: Upcoming Visits -->
      <g transform="translate(325, 180)">
        <rect width="250" height="150" rx="20" fill="#F7F9F6" stroke="#E2EBE0" stroke-width="1.5"/>
        <text x="30" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="600" fill="#6A8274">UPCOMING VISITS</text>
        <text x="30" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="44" font-weight="800" fill="#13241B">1</text>
        <text x="75" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="14" font-weight="700" fill="#43B574">Confirmed</text>
      </g>

      <!-- Appointment Card Item inside Dashboard -->
      <g transform="translate(50, 360)">
        <rect width="525" height="170" rx="20" fill="#FFFFFF" stroke="#DDE7DC" stroke-width="1.5"/>
        <text x="30" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="20" font-weight="800" fill="#13241B">General Health Consultation</text>
        <text x="30" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="15" font-weight="600" fill="#2F6B50">Dr. Emily Carter • Greenfield Medical Centre</text>
        <text x="30" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="500" fill="#7A9385">📅 Monday, 10:00 AM • Room 204</text>
        
        <!-- Action Tag inside Card -->
        <rect x="30" y="122" width="160" height="30" rx="8" fill="#E8F4EC"/>
        <text x="110" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" font-weight="700" fill="#2F6B50" text-anchor="middle">3 Questions • 1 Medication</text>
      </g>
    </g>

    <!-- Foreground Overlapping Layer Card 2: Generated Clinical Checklist Preview -->
    <g transform="translate(380, 280) rotate(2)" filter="url(#heroShadow)">
      <rect width="520" height="640" rx="24" fill="#FFFFFF" stroke="#CAD8C8" stroke-width="2"/>
      
      <!-- Top Green Accent Header -->
      <rect width="520" height="85" rx="24" fill="url(#primaryGrad)"/>
      <rect y="60" width="520" height="25" fill="url(#primaryGrad)"/>
      <text x="35" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">Visit Preparation Checklist</text>
      <text x="35" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" font-weight="500" fill="#A8DFB6">Generated for Dr. Emily Carter Consultation</text>

      <!-- Checklist Section 1: Questions to Ask -->
      <g transform="translate(35, 115)">
        <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="800" fill="#2F6B50" letter-spacing="1">SECTION 1 — QUESTIONS FOR DOCTOR</text>
        
        <!-- Item 1 -->
        <rect x="0" y="15" width="18" height="18" rx="4" fill="#FFFFFF" stroke="#2F6B50" stroke-width="2"/>
        <text x="28" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="600" fill="#13241B">What information should I bring to this visit?</text>

        <!-- Item 2 -->
        <rect x="0" y="50" width="18" height="18" rx="4" fill="#FFFFFF" stroke="#2F6B50" stroke-width="2"/>
        <text x="28" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="600" fill="#13241B">Which points should I remember to discuss?</text>

        <!-- Item 3 -->
        <rect x="0" y="85" width="18" height="18" rx="4" fill="#FFFFFF" stroke="#2F6B50" stroke-width="2"/>
        <text x="28" y="99" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="600" fill="#13241B">What should I clarify before leaving?</text>
      </g>

      <!-- Checklist Section 2: Self-Reported Medications -->
      <g transform="translate(35, 260)">
        <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="800" fill="#2F6B50" letter-spacing="1">SECTION 2 — SELF-REPORTED MEDICATIONS</text>
        
        <rect x="0" y="15" width="450" height="55" rx="10" fill="#F7FAF6" stroke="#DDE7DC" stroke-width="1"/>
        <text x="18" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="14" font-weight="700" fill="#13241B">Example Medication A</text>
        <text x="18" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" font-weight="500" fill="#4B6355">Dose: 10 mg • Frequency: Once daily</text>
      </g>

      <!-- Checklist Section 3: Notes Area -->
      <g transform="translate(35, 375)">
        <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="800" fill="#2F6B50" letter-spacing="1">SECTION 3 — DOCTOR'S NOTES &amp; ACTIONS</text>
        
        <!-- Lined paper notes area -->
        <line x1="0" y1="30" x2="450" y2="30" stroke="#E2EBE0" stroke-width="1.5"/>
        <line x1="0" y1="65" x2="450" y2="65" stroke="#E2EBE0" stroke-width="1.5"/>
        <line x1="0" y1="100" x2="450" y2="100" stroke="#E2EBE0" stroke-width="1.5"/>
        <text x="10" y="24" font-family="Georgia, serif" font-style="italic" font-size="13" fill="#8CA496">Dedicated area for handwritten doctor advice during the visit...</text>
      </g>

      <!-- Bottom Print Stamp -->
      <g transform="translate(35, 520)">
        <rect width="450" height="60" rx="14" fill="url(#accentGrad)"/>
        <text x="225" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">📄 One-Click Browser Print &amp; PDF Export</text>
      </g>
    </g>
  </g>
</svg>

